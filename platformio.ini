; PlatformIO project for MustangDash — Riverdi RVT70H (BT817/EVE4) on STM32.
;
; This drives the VS Code Build/Upload buttons and scripts/compile.sh, which is
; a thin wrapper around `pio run`. There is one build path, not two.
;
; src_dir points at the existing sketch folder instead of PlatformIO's default
; src/, so the .ino layout survives.

; The EVE library is vendored rather than pulled from the registry:
; src/EVE_config.h selects the EVE_RVT70H profile and src/EVE_target/
; carries our pins. Every env below sets lib_extra_dirs = libraries.

[platformio]
src_dir = MustangDash
default_envs = nucleo_f767

; STM32H743 migration target (docs/plans/2026-07-21-001-refactor-stm32-migration-plan.md).
; Board def: WeAct MiniSTM32H743VITX -- same STM32H743VIT6 as the custom carrier
; (KTD1), so the WeAct devkit doubles as a firmware mule until the PCB exists.
; USBCON/USBD_USE_CDC route Serial to the USB-C VCP (U6); the serial protocol
; rides CDC, so the 115200 monitor rate is nominal only.
; Board3 carrier: STM32H755ZIT6 (LQFP-144, dual-core). No H755 board def
; exists in PlatformIO, so this env targets the CM7 through nucleo_h743zi --
; the H743ZIT6 is the same die family in the same LQFP-144 with the same pin
; map, and the firmware never touches the H753/H755 crypto or the CM4. Two
; things the variant gets wrong for Board3, both corrected in the sketch:
; the Nucleo assumes an 8 MHz ST-LINK MCO bypass where Board3 has a 25 MHz
; crystal (X1), so the sketch overrides SystemClock_Config under
; DASH_BOARD_BOARD3 (25 MHz HSE -> 400 MHz, HSI48+CRS for USB); and the
; variant's UART3 default pins are PD8/PD9 -- Board3's center/left CS -- so
; nothing may ever construct Serial3 (Serial is USB CDC via USBCON here).
; ONE-TIME FIRST-CONNECT STEP (H755 only): both cores boot from the factory;
; the CM4 has no image and must be disabled once via option byte --
;   STM32_Programmer_CLI -c port=SWD -ob BCM4=0
; -- see docs/hardware/board3-bringup-card.md.
; -D DASH_CAN_CAR exists but no env sets it yet (plan 2026-08-15-001 KTD7):
; it opts CAN staleness into car semantics -- stale channels dead-front and
; stay CAN-latched instead of returning to the sim. Bench default everywhere.
[env:board3]
platform = ststm32
board = nucleo_h743zi
framework = arduino
lib_extra_dirs = libraries
monitor_speed = 115200
upload_protocol = stlink
; Repo-local variant, shared with board3_mule -- its one delta from stock is
; the ExitRun0Mode supply guard. Stock hard-defines USE_PWR_LDO_SUPPLY, whose
; H743-compiled branch is an OR that cannot clear the H755's SMPSEN bit
; (bit 2 = SCUEN in H743 headers), so the chip spins pre-main at the
; ACTVOSRDY wait (hit live 2026-08-19, Board3 first power-on). The variant
; no-ops ExitRun0Mode; the sketch's SystemClock_Config makes the first --
; correct, LDO-only, raw-bit -- supply write after POR.
board_build.variants_dir = boards/variants
board_build.variant = H755ZI_Q_MULE
build_flags =
    -D DASH_BOARD_BOARD3
    -D HSE_VALUE=25000000UL
    -D USBCON
    -D USBD_USE_CDC
    -D USB_PRODUCT="\"MustangDash\""
    -D HAL_FDCAN_MODULE_ENABLED
    -D HAL_QSPI_MODULE_ENABLED
    -Wl,-u,_printf_float

; Board3 firmware on the bench NUCLEO-H755ZI-Q -- "get the code working"
; before the boards arrive, on the SAME STM32H755 die Board3 carries (U1).
; No H755 board def exists in PlatformIO, so this rides nucleo_h743zi (same
; LQFP-144 pin map, CM7 target); the sketch supplies the mule clock block.
; TWO THINGS THE -Q BOARD CHANGES, both handled:
;   * -Q = SMPS-powered VCORE. The variant's stock clock config selects LDO,
;     which HANGS SMPS silicon at the ACTVOSRDY wait (looks bricked). The H7
;     supply config is WRITE-ONCE until POR, so reflashing does NOT recover
;     it -- recovery is fixed firmware + a full power cycle (see the variant
;     override note below). DASH_MULE_H755Q selects the sketch's
;     PWR_DIRECT_SMPS_SUPPLY override -- 400 MHz, same operating point as
;     the real board3 env, USB on HSI48+CRS proven on the real die.
;   * Factory H755 boots BOTH cores; the CM4 has no image. Run the one-time
;     BCM4=0 option byte on the Nucleo FIRST -- rehearsing the exact step
;     Board3 needs (STM32_Programmer_CLI -c port=SWD -ob BCM4=0).
; Every Board3 signal is on the Zio headers, so mule sessions run the REAL
; pins: panels on FFC breakouts (SPI1 PA5/6/7 CS PD8 PD PD11; SPI2
; PB13/14/15 CS PD9 PD PD12; SPI4 PE2/5/6 CS PE3 PD PD13), USB CDC + the
; ok/err protocol (never bench-run on H7), AW9523B I2C lamp glue on
; breakouts at PB10/11 (never had hardware), odometer on the I2C FRAM
; breakout at 0x50 on PB10/11 (RAM shadow when absent -- there is no
; H7-flash EEPROM emulation; proven on the mule 2026-08-14),
; the PC6 button, the QSPI probe (unwired -> graceful FAILED; W25Q256
; breakout on PB2/PF6-9/PG6 -> the ok path).
; BENCH TRAP: the Nucleo's ST-LINK VCP is USART3 on PD8/PD9 -- the center
; and left CS pins. Open the two VCP solder bridges (see the Nucleo-144
; user manual) before the panel session, or the ST-LINK's TX fights left CS.
; What the mule CANNOT prove: the 25 MHz crystal block and Board3's copper
; at 13.5 MHz. Those wait for the real board.
; VARIANT OVERRIDE (2026-08-12, found hung on the bench): the sketch's
; SystemClock_Config override is NOT enough to dodge the LDO hang. The stock
; variant header hard-defines USE_PWR_LDO_SUPPLY, which ExitRun0Mode() obeys
; from the startup file BEFORE main() -- and the H7 supply config is
; write-once until POR, so the first true power-on latches LDO and every
; boot after it hangs at the ACTVOSRDY wait (warm reset does not clear it).
; It slipped through bring-up because warm resets inherit the factory demo's
; correct SMPS latch; the first real power cycle exposed it. The repo-local
; variant copy guards that define under DASH_MULE_H755Q -- and, since
; 2026-08-19, under DASH_BOARD_BOARD3 too: Board3's first power-on hung the
; same way (stock LDO branch can't clear the H755's SMPSEN; see [env:board3]).
; An earlier revision of this comment said board3 "stays on the stock
; upstream variant on purpose" -- that reasoning did not survive first
; contact with the real silicon.
[env:board3_mule]
platform = ststm32
board = nucleo_h743zi
framework = arduino
lib_extra_dirs = libraries
monitor_speed = 115200
upload_protocol = stlink
board_build.variants_dir = boards/variants
board_build.variant = H755ZI_Q_MULE
build_flags =
    -D DASH_BOARD_BOARD3
    -D DASH_MULE_H755Q
    -D USBCON
    -D USBD_USE_CDC
    -D USB_PRODUCT="\"MustangDash\""
    -D HAL_FDCAN_MODULE_ENABLED
    -D HAL_QSPI_MODULE_ENABLED
    -Wl,-u,_printf_float

[env:h743]
platform = ststm32
board = weact_mini_h743vitx
framework = arduino
lib_extra_dirs = libraries
monitor_speed = 115200
build_flags =
    -D USBCON
    -D USBD_USE_CDC
    -D USB_PRODUCT="\"MustangDash\""
    -D HAL_FDCAN_MODULE_ENABLED
; review fix: newlib-nano omits float printf by default -- without this every
; %.1f dash cell and banner value renders empty on the h743 target
    -Wl,-u,_printf_float

; Riverdi STM32 Evaluation Board (STM32F469II on the board; disco_f469ni is
; the same die/flash in PlatformIO's catalog). One RiBUS connector -> center
; panel only over SPI2; jumpers P9-P8 hand the panel to the STM32. Pin map
; from riverdi-eve host_layer/stm32f4: CS PB12, PD PH6, SPI2 PB13/14/15.
; No FDCAN on F4 -> dash_can.h compiles its stubs (no HAL_FDCAN flag).
; PROGRAMMING: SWD header (P10) + ST-LINK ONLY -- BOOT0 is board-strapped
; with no header access (schematic SCHEM_EVAL_MAIN_REV1.2), so USB DFU and
; UART bootloader are unreachable. Crystal is 12 MHz (X2): if USB CDC fails
; to enumerate, set -D HSE_VALUE=12000000 -- generic clock configs assume
; 8/25 MHz and a wrong HSE breaks the 48 MHz USB clock.
; NUCLEO-F767ZI three-panel mule: Cortex-M7 like the H743 target, 2 MB
; flash, six SPI peripherals, onboard ST-LINK (which doubles as the
; programmer for the Riverdi eval board via CN4). Serial rides the
; ST-LINK's VCP (USART3), so no USB CDC flags. Panels connect via FFC/ZIF
; breakouts; backlights stay on external 5V (Nucleo USB cannot feed them).
; bxCAN not FDCAN -> dash_can.h stubs. Pin plan avoids Ethernet RMII
; (PA1/2/7, PC1/4/5, PG11/13, PB13), USB (PA8-12), VCP (PD8/9),
; LEDs (PB0/7/14), and B1 (PC13).
[env:nucleo_f767]
platform = ststm32
board = nucleo_f767zi
framework = arduino
lib_extra_dirs = libraries
monitor_speed = 115200
build_flags =
    -D DASH_BOARD_NUCLEO_F767
    -Wl,-u,_printf_float

[env:riverdi_f469]
platform = ststm32
board = riverdi_f469
framework = arduino
lib_extra_dirs = libraries
monitor_speed = 115200
board_build.ldscript = boards/riverdi_f469_ldscript.ld
board_build.variants_dir = boards/variants
build_flags =
    -D USBCON
    -D USBD_USE_CDC
    -D USB_PRODUCT="\"MustangDash\""
    -D DASH_BOARD_RIVERDI_F469
    -Wl,-u,_printf_float
