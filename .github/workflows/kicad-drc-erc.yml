# Design rule and electrical rule checks.
#
# The only workflow here that needs a real KiCad, so it runs in the official
# image pinned to the same version as the workstation (10.0.5). Pinned rather
# than floating: a KiCad upgrade that changes rule behaviour should be a visible
# commit, not a Tuesday where CI starts failing on an unchanged board.
#
# Board3 was routed to zero airwires and a DRC below its conversion baseline.
# That state is easy to lose and expensive to notice late -- a DRC regression is
# a scrapped board, not a code review comment.
#
# Severity is errors-only. A converted EasyEDA board carries warnings that are
# noise, and a check that cries wolf is a check people learn to merge past.
name: KiCad DRC and ERC

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      # The image runs as the 'kicad' user; actions/checkout needs to own the
      # workspace it writes into.
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: KiCad version
        run: kicad-cli version

      - name: Locate project
        id: find
        run: |
          set -euo pipefail
          echo "pcb=$(ls kicad/board3/*.kicad_pcb | head -1)" >> "$GITHUB_OUTPUT"
          echo "sch=$(ls kicad/board3/*.kicad_sch | head -1)" >> "$GITHUB_OUTPUT"

      # The DRC bar is a delta, not an absolute. Board3 came out of the EasyEDA
      # Pro importer carrying 41 error-severity violations -- courtyard overlaps
      # and edge clearances that no layout work removes -- so a zero-violation
      # gate is unreachable by construction and would only teach people to merge
      # past a red check (KTD3). This is that import, checked out beside the
      # working tree so the inherited violations can be attributed to it.
      - name: Check out the import baseline
        uses: actions/checkout@v4
        with:
          ref: 52586d44e4490d43a20e6fb8543b4e6f641bfd61
          path: import-baseline

      # Ratchet: PRs compare against their own base, so every improvement locks
      # in at merge and the slack between "current" and "import baseline" can
      # never be silently spent. Pushes to main keep the import-baseline floor.
      - name: Check out the PR base (ratchet baseline)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: pr-base

      - name: Pick comparison baseline
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dir=pr-base" >> "$GITHUB_OUTPUT"
          else
            echo "dir=import-baseline" >> "$GITHUB_OUTPUT"
          fi

      # Informational: the raw report that ships in the artifact. It measures
      # against the board's own .kicad_pro, and it no longer carries
      # --exit-code-violations -- the step below is the gate.
      - name: DRC report
        run: |
          kicad-cli pcb drc \
            --severity-error \
            --format json \
            -o drc.json \
            "${{ steps.find.outputs.pcb }}"

      # Parity is OFF by default in kicad-cli, and it is the only check that
      # compares a footprint against its SYMBOL rather than against its own
      # library copy. That blind spot shipped real defects: F1 kept the old
      # fuse's land pattern after U32 changed the part, and C70/C71/R4/LED3 were
      # each left marked on the board with a part an earlier unit had replaced.
      # Plain DRC passed every one of them. This gate is absolute rather than
      # ratcheted -- the board and the schematic either agree or they do not.
      - name: Schematic parity gate
        run: |
          kicad-cli pcb drc \
            --schematic-parity \
            --severity-all \
            --format json \
            -o parity.json \
            "${{ steps.find.outputs.pcb }}"
          python3 - <<'PY'
          import collections, json, sys
          issues = json.load(open("parity.json", encoding="utf-8")).get("schematic_parity", [])
          if not issues:
              print("schematic parity: clean")
              sys.exit(0)
          for kind, n in collections.Counter(i["type"] for i in issues).most_common():
              print(f"  {n:4d}  {kind}")
          for i in issues[:25]:
              where = ", ".join(x.get("description", "") for x in i.get("items", []))
              print(f"    - {i.get('description', '')}  [{where}]")
          print(f"\n{len(issues)} schematic parity issue(s): the board disagrees with the schematic.")
          sys.exit(1)
          PY

      # Fails on NEW violations only, compared per type so a falling total
      # cannot hide a class that did not exist before. Both boards are measured
      # through tools/kicad_rules.json, never their own .kicad_pro.
      - name: DRC delta (per-type, ratcheted)
        # --contract count is per-type "no worse than the baseline". On PRs the
        # baseline is the PR base, so improvements lock in at merge; on pushes
        # it is the import-baseline floor. Instance-identity churn between
        # distant states is lawful (parts move); adjacent-state gates during
        # work keep kicad_verify's identity default, where a swap cannot hide.
        run: |
          python3 tools/kicad_verify.py \
            "${{ steps.find.outputs.pcb }}" \
            --baseline "${{ steps.base.outputs.dir }}/${{ steps.find.outputs.pcb }}" \
            --contract count

      - name: ERC delta (per-type on PRs, total on the main floor)
        # The schematic carries a known ERC debt (unflagged unused pins), so
        # --exit-code-violations would fail on ANY run forever. PRs are gated
        # per type against their own base -- a category cannot regress behind
        # another's improvement. The push-to-main floor stays a total against
        # the import baseline because of one known pre-existing wrinkle
        # (pin_not_driven 70 -> 71 inside a net-improved total); tighten it to
        # per-type once that +1 is attributed and cleared.
        if: always()
        run: |
          kicad-cli sch erc \
            --severity-error \
            --format json \
            -o erc.json \
            "${{ steps.find.outputs.sch }}"
          kicad-cli sch erc \
            --severity-error \
            --format json \
            -o erc-base.json \
            "${{ steps.base.outputs.dir }}/${{ steps.find.outputs.sch }}"
          EVENT="${{ github.event_name }}" python3 - <<'PY'
          import collections, json, os, sys
          def counts(path):
              d = json.load(open(path))
              c = collections.Counter()
              for s in d.get('sheets', []):
                  for v in s.get('violations', []):
                      c[v.get('type')] += 1
              return c
          cur, base = counts('erc.json'), counts('erc-base.json')
          print('ERC current :', sum(cur.values()), dict(cur))
          print('ERC baseline:', sum(base.values()), dict(base))
          if os.environ.get('EVENT') == 'pull_request':
              worse = {k: (cur[k], base.get(k, 0)) for k in cur if cur[k] > base.get(k, 0)}
              for k, (c, b) in sorted(worse.items()):
                  print(f'::error::ERC {k}: {c} exceeds base {b}')
              sys.exit(1 if worse else 0)
          sys.exit(0 if sum(cur.values()) <= sum(base.values()) else 1)
          PY

      # The BOM comes from the schematic and the CPL from the board, and both
      # exports drop DNP parts. So a part marked Do-Not-Populate on only ONE side
      # vanishes from one file and stays in the other -- each file internally
      # valid, the pair unorderable. JLCPCB catches it at upload; before this
      # step, nothing here did.
      #
      # It happened: a GUI "Update PCB from Schematic" run (3c9f8c1) set DNP on
      # 16 board footprints the schematic never marked -- the eight telltales,
      # both AW9523B expanders, their decoupling. DRC stayed 0/0 and every other
      # check passed. Only the vendor's uploader objected, and its dialog offers
      # a "Continue" button that would have fabricated the board with its whole
      # telltale subsystem unpopulated.
      #
      # kicad_fab.py owns the assertion and exits non-zero on it; this step is
      # just where a PR gets told. Output goes to a scratch dir -- the package
      # under fab/ is a release artifact, not something a check should rewrite.
      - name: Fab package is orderable (BOM/CPL symmetry)
        if: always()
        run: python3 tools/kicad_fab.py kicad/board3/ --out /tmp/fab-check

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-reports
          path: |
            drc.json
            erc.json
          if-no-files-found: warn
