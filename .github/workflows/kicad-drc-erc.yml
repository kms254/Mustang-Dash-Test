# Design rule and electrical rule checks.
#
# The only workflow here that needs a real KiCad, so it runs in the official
# image pinned to the same version as the workstation (10.0.5). Pinned rather
# than floating: a KiCad upgrade that changes rule behaviour should be a visible
# commit, not a Tuesday where CI starts failing on an unchanged board.
#
# Board3 was routed to zero airwires and a DRC below its conversion baseline.
# That state is easy to lose and expensive to notice late -- a DRC regression is
# a scrapped board, not a code review comment.
#
# Severity is errors-only. A converted EasyEDA board carries warnings that are
# noise, and a check that cries wolf is a check people learn to merge past.
name: KiCad DRC and ERC

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      # The image runs as the 'kicad' user; actions/checkout needs to own the
      # workspace it writes into.
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: KiCad version
        run: kicad-cli version

      - name: Locate project
        id: find
        run: |
          set -euo pipefail
          echo "pcb=$(ls kicad/board3/*.kicad_pcb | head -1)" >> "$GITHUB_OUTPUT"
          echo "sch=$(ls kicad/board3/*.kicad_sch | head -1)" >> "$GITHUB_OUTPUT"

      # NOTE ON THE BASELINE THAT USED TO LIVE HERE. Board3 came out of the
      # EasyEDA Pro importer carrying 41 error-severity violations, so both the
      # DRC and ERC gates were deltas against a checked-out baseline (the import
      # commit 52586d4, or the PR base). Every one of those has since been
      # cleared -- ERC 1009 -> 0 and DRC to 0 at --severity-all under the real
      # rules -- so both gates are now absolute and nothing consumes a baseline.
      # The two checkout steps and the baseline picker were removed rather than
      # left dead: they cloned the repo twice per run to feed a comparison no
      # step made any more. Restore from history if a floor ever genuinely
      # returns, but prefer fixing the design -- see
      # docs/solutions/developer-experience/a-large-erc-count-is-a-broken-instrument.md

      # Informational: the raw report that ships in the artifact. It measures
      # against the board's own .kicad_pro, and it no longer carries
      # --exit-code-violations -- the step below is the gate.
      # A KiCad library can be present, well-formed, and still refuse to load --
      # and NOTHING else here notices, because the schematic renders every symbol
      # from its own lib_symbols cache. ProPrj_New-easyedapro.kicad_sym was
      # unloadable for months: sheet correct, netlist correct, BOM correct, DRC
      # 0/0/0 the whole time. One symbol in it was named
      # "CAPACITOR_THT:CP_RADIAL_D8.0MM_P2.50MM", and a colon is the
      # library/symbol separator in a KiCad ID, so KiCad rejected all 94 symbols.
      #
      # ERC did say so -- 124 lib_symbol_issues -- but that check is a WARNING and
      # the ERC gate below ran --severity-error at the time. It was invisible by
      # construction. That gate is now absolute at --severity-all, so this is a
      # second line rather than the only one -- and it is still worth its own
      # step, because it names the offending symbol instead of reporting that
      # every part in the library went missing.
      # This step is absolute rather than ratcheted: a library either loads or it
      # does not.
      - name: Every declared symbol library actually loads
        run: python3 tools/kicad_libcheck.py kicad/board3

      - name: DRC report
        run: |
          kicad-cli pcb drc \
            --severity-error \
            --format json \
            -o drc.json \
            "${{ steps.find.outputs.pcb }}"

      # Parity is OFF by default in kicad-cli, and it is the only check that
      # compares a footprint against its SYMBOL rather than against its own
      # library copy. That blind spot shipped real defects: F1 kept the old
      # fuse's land pattern after U32 changed the part, and C70/C71/R4/LED3 were
      # each left marked on the board with a part an earlier unit had replaced.
      # Plain DRC passed every one of them. This gate is absolute rather than
      # ratcheted -- the board and the schematic either agree or they do not.
      - name: Schematic parity gate
        run: |
          kicad-cli pcb drc \
            --schematic-parity \
            --severity-all \
            --format json \
            -o parity.json \
            "${{ steps.find.outputs.pcb }}"
          python3 - <<'PY'
          import collections, json, sys
          issues = json.load(open("parity.json", encoding="utf-8")).get("schematic_parity", [])
          if not issues:
              print("schematic parity: clean")
              sys.exit(0)
          for kind, n in collections.Counter(i["type"] for i in issues).most_common():
              print(f"  {n:4d}  {kind}")
          for i in issues[:25]:
              where = ", ".join(x.get("description", "") for x in i.get("items", []))
              print(f"    - {i.get('description', '')}  [{where}]")
          print(f"\n{len(issues)} schematic parity issue(s): the board disagrees with the schematic.")
          sys.exit(1)
          PY

      # ABSOLUTE. This was a per-type ratchet against a baseline, on the premise
      # that the EasyEDA import left an unclearable floor (measured 36 at the
      # time). That premise is now false: measured through tools/kicad_rules.json
      # -- the real rules, never the board's own .kicad_pro -- the board reports
      # 0 violations and 0 unconnected at --severity-all with the library
      # sidecars staged. Zero is reachable, so zero is the bar.
      #
      # kicad_verify still supports --baseline and --contract for interactive
      # work, where attributing a pre-existing violation is genuinely useful.
      # It is the CI GATE that has no business carrying a floor. If this ever
      # needs a baseline again, that is the signal something regressed -- fix
      # the board, do not re-ratchet the gate.
      - name: DRC gate (absolute, staged rules)
        run: |
          python3 tools/kicad_verify.py "${{ steps.find.outputs.pcb }}"

      # ABSOLUTE, and at --severity-all. This was a ratchet at --severity-error,
      # justified by "the schematic carries a known ERC debt (unflagged unused
      # pins)" -- and that premise is now false. All 1009 violations were driven
      # to zero without one net moving (netlist byte-identical: 228 nets, no
      # membership change), so zero is a state this schematic can occupy, and a
      # gate that only has to not-grow can never make anyone read the report.
      #
      # The severity is the load-bearing half. At --severity-error this gate was
      # STRUCTURALLY unable to report the one real defect in the pile: the 124
      # lib_symbol_issues saying a whole symbol library would not load are a
      # WARNING, so they were invisible by construction for months while this
      # check ran green on every push. A filter is a blind spot, not a setting.
      #
      # If this ever needs a baseline again, that is the signal something
      # regressed -- fix the schematic, do not re-ratchet the gate.
      # docs/solutions/developer-experience/a-large-erc-count-is-a-broken-instrument.md
      - name: ERC gate (absolute, all severities)
        if: always()
        run: |
          kicad-cli sch erc \
            --severity-all \
            --format json \
            -o erc.json \
            "${{ steps.find.outputs.sch }}"
          python3 - <<'PY'
          import collections, json, sys
          d = json.load(open('erc.json', encoding='utf-8'))
          items = [v for s in d.get('sheets', []) for v in s.get('violations', [])]
          if not items:
              print('ERC: clean (0 violations at --severity-all)')
              sys.exit(0)
          for kind, n in collections.Counter(i.get('type') for i in items).most_common():
              print(f'  {n:4d}  {kind}')
          for i in items[:25]:
              print(f"    - [{i.get('severity')}] {i.get('description', '')}")
          if len(items) > 25:
              print(f'    ... and {len(items) - 25} more')
          print(f'\n::error::ERC is not clean: {len(items)} violation(s).')
          sys.exit(1)
          PY

      # The BOM comes from the schematic and the CPL from the board, and both
      # exports drop DNP parts. So a part marked Do-Not-Populate on only ONE side
      # vanishes from one file and stays in the other -- each file internally
      # valid, the pair unorderable. JLCPCB catches it at upload; before this
      # step, nothing here did.
      #
      # It happened: a GUI "Update PCB from Schematic" run (3c9f8c1) set DNP on
      # 16 board footprints the schematic never marked -- the eight telltales,
      # both AW9523B expanders, their decoupling. DRC stayed 0/0 and every other
      # check passed. Only the vendor's uploader objected, and its dialog offers
      # a "Continue" button that would have fabricated the board with its whole
      # telltale subsystem unpopulated.
      #
      # kicad_fab.py owns the assertion and exits non-zero on it; this step is
      # just where a PR gets told. Output goes to a scratch dir -- the package
      # under fab/ is a release artifact, not something a check should rewrite.
      - name: Fab package is orderable (BOM/CPL symmetry)
        if: always()
        run: python3 tools/kicad_fab.py kicad/board3/ --out /tmp/fab-check

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-reports
          path: |
            drc.json
            erc.json
          if-no-files-found: warn
