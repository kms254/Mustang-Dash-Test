# Design rule and electrical rule checks.
#
# The only workflow here that needs a real KiCad, so it runs in the official
# image pinned to the same version as the workstation (10.0.5). Pinned rather
# than floating: a KiCad upgrade that changes rule behaviour should be a visible
# commit, not a Tuesday where CI starts failing on an unchanged board.
#
# Board3 was routed to zero airwires and a DRC below its conversion baseline.
# That state is easy to lose and expensive to notice late -- a DRC regression is
# a scrapped board, not a code review comment.
#
# Severity is errors-only. A converted EasyEDA board carries warnings that are
# noise, and a check that cries wolf is a check people learn to merge past.
name: KiCad DRC and ERC

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      # The image runs as the 'kicad' user; actions/checkout needs to own the
      # workspace it writes into.
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: KiCad version
        run: kicad-cli version

      - name: Locate project
        id: find
        run: |
          set -euo pipefail
          echo "pcb=$(ls kicad/board3/*.kicad_pcb | head -1)" >> "$GITHUB_OUTPUT"
          echo "sch=$(ls kicad/board3/*.kicad_sch | head -1)" >> "$GITHUB_OUTPUT"

      # The DRC bar is a delta, not an absolute. Board3 came out of the EasyEDA
      # Pro importer carrying 41 error-severity violations -- courtyard overlaps
      # and edge clearances that no layout work removes -- so a zero-violation
      # gate is unreachable by construction and would only teach people to merge
      # past a red check (KTD3). This is that import, checked out beside the
      # working tree so the inherited violations can be attributed to it.
      - name: Check out the import baseline
        uses: actions/checkout@v4
        with:
          ref: 52586d44e4490d43a20e6fb8543b4e6f641bfd61
          path: import-baseline

      # Informational: the raw report that ships in the artifact. It measures
      # against the board's own .kicad_pro, and it no longer carries
      # --exit-code-violations -- the step below is the gate.
      - name: DRC report
        run: |
          kicad-cli pcb drc \
            --severity-error \
            --format json \
            -o drc.json \
            "${{ steps.find.outputs.pcb }}"

      # Fails on NEW violations only, compared per type so a falling total
      # cannot hide a class that did not exist before. Both boards are measured
      # through tools/kicad_rules.json, never their own .kicad_pro.
      - name: DRC delta against the import baseline
        # --contract count: against the distant import baseline, deliberate
        # placement changes lawfully relocate violation instances; the campaign
        # contract is "no worse per type". Adjacent-state gates during work
        # keep kicad_verify's identity default, where a swap must not hide.
        run: |
          python3 tools/kicad_verify.py \
            "${{ steps.find.outputs.pcb }}" \
            --baseline "import-baseline/${{ steps.find.outputs.pcb }}" \
            --contract count

      - name: ERC delta against the import baseline
        # The schematic carries a known ERC debt (unflagged unused pins), so
        # --exit-code-violations would fail on ANY run forever. The gate is a
        # delta: fail only when the count exceeds the import baseline's.
        if: always()
        run: |
          kicad-cli sch erc \
            --severity-error \
            --format json \
            -o erc.json \
            "${{ steps.find.outputs.sch }}"
          kicad-cli sch erc \
            --severity-error \
            --format json \
            -o erc-base.json \
            "import-baseline/${{ steps.find.outputs.sch }}"
          cur=$(python3 -c "import json;d=json.load(open('erc.json'));print(sum(len(s.get('violations',[])) for s in d.get('sheets',[])))")
          base=$(python3 -c "import json;d=json.load(open('erc-base.json'));print(sum(len(s.get('violations',[])) for s in d.get('sheets',[])))")
          echo "ERC errors: current=$cur baseline=$base"
          test "$cur" -le "$base"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-reports
          path: |
            drc.json
            erc.json
          if-no-files-found: warn
